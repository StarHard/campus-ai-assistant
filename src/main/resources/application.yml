# 服务端口
server:
  port: 8080
  servlet:
    context-path: /api

# Spring配置
spring:
  application:
    name: campus-ai-assistant
  # 数据源配置（组员B已完成数据库表设计，已启用）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_assistant?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,log4j2
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*/druid/*"
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin123
  # SQL初始化（启动时自动执行schema.sql建表）
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

  # Jackson JSON配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  # SpringAI Alibaba DashScope配置
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:sk-ws-H.REEYEXR.xUmv.MEYCIQCh89UgqK4-nCDzBmiI6z_QnPcHFQvg25lb9lXbhkZmbgIhAP80ZaXbUiAy1XrZt6PEJkC4A3ASMcjIlVtzeWZ2Mxyp}
      chat:
        options:
          model: qwen-max
          temperature: 0.7
          max-tokens: 2000

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.campus.ai.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    root: INFO
    com.campus.ai: DEBUG
    org.springframework.ai: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/campus-ai-assistant.log
    max-size: 100MB
    max-history: 30

# RAG检索增强生成配置
rag:
  enabled: true
  # 向量数据库配置（可选用Milvus或内存存储）
  vector-store:
    type: memory  # memory | milvus | chroma
    dimension: 1536
  # 文档知识库路径
  knowledge-base:
    path: ./data/knowledge-base
    supported-formats: .pdf,.doc,.docx,.txt,.md
  # 检索配置
  retrieval:
    top-k: 5
    similarity-threshold: 0.7

# 多线程并发控制配置
concurrent:
  # AI请求处理线程池
  ai-thread-pool:
    core-pool-size: 5
    maximum-pool-size: 20
    queue-capacity: 100
    keep-alive-seconds: 60
    thread-name-prefix: AI-Worker-
  # 流式响应线程池
  streaming-thread-pool:
    core-pool-size: 10
    maximum-pool-size: 50
    queue-capacity: 200
    keep-alive-seconds: 60
    thread-name-prefix: Streaming-Worker-

# Knife4j API文档配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# SpringDoc OpenAPI配置（修复Spring Boot 3.4.x兼容性问题）
springdoc:
  override-with-generic-response: false

# 自定义应用配置
app:
  # 系统提示词模板
  system-prompt: |
    你是一个专业的校园智能服务助手，你的职责包括：
    1. 解答关于校园规章制度的疑问
    2. 提供选课指导和课程咨询
    3. 提供专业培训方案建议
    4. 回答校园生活相关问题
    
    请基于提供的校园文档知识库信息，给出准确、友好、专业的回答。
    如果问题超出你的知识范围，请礼貌地说明并建议用户咨询相关部门。

  # 请求限制配置
  rate-limit:
    enabled: true
    requests-per-minute: 30
    requests-per-hour: 300
